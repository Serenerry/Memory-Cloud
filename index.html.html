:root{--book-serif:'Newsreader','Libre Baskerville',Georgia,serif}

.page:last-child{border-left:0;box-shadow:inset 14px 0 20px #251d1b0a,0 3px 0 color-mix(in srgb,var(--binder) 20%,var(--card)),0 6px 0 color-mix(in srgb,var(--binder) 12%,var(--card)),0 9px 18px #00000012}

.mc-search{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.mc-search input{flex:1;min-width:190px}.mc-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;max-height:360px;overflow:auto}.mc-result{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;text-align:left;color:var(--ink);cursor:pointer}.mc-result img{height:66px;width:48px;object-fit:cover;border-radius:3px}.mc-result small{display:block;color:var(--muted)}.mc-overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:12px;max-height:65vh;overflow:auto}.mc-overview button{padding:9px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;cursor:pointer}.mc-mini{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:6px}.mc-mini-page{background:#fff;border:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px;min-height:85px}.mc-mini-page img{width:100%;height:27px;object-fit:cover}.mc-mini-page i{background:#f3f3f3}.cover-editor-preview{background-image:var(--cover-image,none);background-size:cover;background-position:center}.mc-upload{display:block;margin:12px 0}.mc-upload input{max-width:100%;margin-top:5px}.mc-notice{padding:10px;border:1px solid var(--line);border-radius:8px;margin:10px 0;color:var(--muted);font-size:13px}
</style></head><body><div class="app"><header class="header"><div class="logo">☁ <i>Memory</i> Cloud <span style="font:400 11px 'DM Sans',sans-serif;letter-spacing:1px">STUDIO</span></div><nav class="topnav"><button data-view="shelf" class="active">☁ Bookshelf</button><button data-view="theme">☁ Theme & Style</button><button data-view="settings">☁ Settings</button></nav></header><main id="main"></main><footer class="footer">Memory Cloud · A little home for your favourite moments ✦ Saved on this device</footer></div><input id="photoInput" type="file" accept="image/*" hidden><input id="importInput" type="file" accept="application/json,.json" hidden><div id="overlay"></div><script>
(()=>{'use strict';const KEY='memory-cloud-v1',colors=['#813f58','#a46a81','#e6a4b4','#e8b9c8','#f6c8a8','#d6a86e','#9a765c','#6a463d','#29262e','#66738b','#9db8cf','#a5bca8','#627e69','#b6a4c8','#d6c8bc','#f6f1e9'];const presets=[{name:'Classic Maison',bg:'#f7f1ea',card:'#fffaf4',accent:'#813f58',glow:'#d9a7b5'},{name:'Midnight Gallery',bg:'#222028',card:'#302c37',accent:'#d6a6bb',glow:'#835c95'},{name:'Cloud Nine',bg:'#eaf1fa',card:'#ffffff',accent:'#5679b0',glow:'#a9c9ef'},{name:'Strawberry Milk',bg:'#fff0f2',card:'#fffafa',accent:'#c35e84',glow:'#f3b3c9'},{name:'Forest Letters',bg:'#edf2e9',card:'#fafcf6',accent:'#4f7863',glow:'#b1c8a6'},{name:'Buttercream',bg:'#fff5e5',card:'#fffdf8',accent:'#ae8051',glow:'#ead39d'},{name:'Rosewood Library',bg:'#e7d8cc',card:'#fff5eb',accent:'#773c46',glow:'#c58e8f'},{name:'Lavender Haze',bg:'#f0eafa',card:'#fffaff',accent:'#8465a5',glow:'#cdb1e3'},{name:'Ocean Glass',bg:'#e2f1f1',card:'#f7ffff',accent:'#347d8c',glow:'#a5dce3'},{name:'Cocoa Study',bg:'#342a28',card:'#473a36',accent:'#dfb78c',glow:'#9b7061'}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.books))state={books:[],active:null,view:'shelf',site:{...presets[0]},sound:true};state.site={...presets[0],...state.site};let anim='',uploadTarget=null,audio=null,db=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2,10),book=()=>state.books.find(b=>b.id===state.active),page=()=>book()?.pages[book().index],save=()=>{try{if(db){const tx=db.transaction('collections','readwrite');tx.objectStore('collections').put(JSON.parse(JSON.stringify(state)),'main');tx.onerror=()=>toast('Could not save to browser database. Export a backup.');localStorage.setItem(KEY,JSON.stringify({books:[],active:null,view:'shelf',site:state.site,sound:state.sound,idb:true}));}else localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Storage issue. Export a backup.');return false}},toast=t=>{let el=$('#toast');if(el)el.remove();el=document.createElement('div');el.id='toast';el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)};function sound(){if(!state.sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(490,audio.currentTime);o.frequency.exponentialRampToValueAtTime(220,audio.currentTime+.12);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}catch{}}function applyTheme(){const s=state.site;for(const k of ['bg','card','accent','glow'])document.documentElement.style.setProperty('--'+k,s[k]);document.documentElement.style.setProperty('--ink',s.ink|| (luma(s.bg)<.38?'#f5edf2':'#30282b'));document.documentElement.style.setProperty('--muted',luma(s.bg)<.38?'#c8bac5':'#786d70');document.documentElement.style.setProperty('--line',luma(s.bg)<.38?'#625662':'#ded2cb');}function luma(hex){let m=/^#([a-f\d]{6})$/i.exec(hex);if(!m)return 1;let c=m[1].match(/../g).map(x=>parseInt(x,16)/255);return(c[0]*.2126+c[1]*.7152+c[2]*.0722)}function render(){applyTheme();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#main').innerHTML=state.view==='shelf'?shelf():state.view==='binder'?binder():state.view==='theme'?theme():settings();if(anim){const e=$('.spread');if(e)e.classList.add(anim);anim=''}}function setView(v){if(v==='binder'&&!book())v='shelf';state.view=v;save();render()}function safeColor(c){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:'#a46a81'}function shelf(){return `<section class="view"><div class="hero"><div><span class="eyebrow">Your personal library</span><h1>Welcome to your<br>little memory cloud.</h1><p>Pick a book from your shelf, or make a new home for your memories. Personalise each book cover inside the binder.</p><button class="outline" data-action="search">⌕ Search all photocards</button> <span class="pill">☁ ${state.books.length} binder${state.books.length===1?'':'s'} in your library</span></div><button class="button" data-action="new">＋ Create a binder</button></div><div class="library-scene"><div class="library-crown"><span>✦</span> THE MEMORY CLOUD LIBRARY <span>✦</span></div><div class="library-shelves">${state.books.length?state.books.map(b=>`<article class="shelf-volume"><button class="book-spine material-${esc(b.material||'matte')}" style="--cover:${safeColor(b.color)};--cover-image:${b.coverImage?`url(${b.coverImage})`:'none'}" data-action="open" data-id="${b.id}" title="Open ${esc(b.name)}"><span class="spine-emblem">${esc(b.icon||'✦')}</span><span class="spine-name">${esc(b.name)}</span><span class="spine-custom">${esc(b.spineText||'')}</span><span class="spine-base">MEMORY CLOUD</span></button><div class="volume-controls" aria-label="Book options"><button class="shelf-tool" data-action="coverModal" data-id="${b.id}" title="Change cover">✦ Cover</button><button class="shelf-tool" data-action="rename" data-id="${b.id}" title="Rename binder">✎ Rename</button><button class="shelf-tool danger" data-action="deletebook" data-id="${b.id}" title="Delete binder">× Delete</button></div></article>`).join(''):`<div class="library-empty"><div style="font-size:48px">☁</div><h2>An empty shelf, full of possibility</h2><p>Create your first binder to begin your collection.</p><button class="button" data-action="new">Create my first binder</button></div>`}</div><div class="library-plinth">✧ &nbsp; A LITTLE LIBRARY OF YOUR FAVOURITE MOMENTS &nbsp; ✧</div></div></section>`}function cloudLogo(){return `<svg class="cloud-mark" viewBox="0 0 100 75" xmlns="http://www.w3.org/2000/svg" aria-label="Memory Cloud logo" role="img"><path d="M26 58h48c12 0 18-8 18-18 0-11-9-19-20-19-3 0-6 1-8 2C59 10 48 6 38 10 27 14 23 22 23 31 11 31 6 40 8 48c2 6 8 10 18 10Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><path d="M36 43h28" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".65"/></svg>`}
function cardStyle(meta){const back=safeColor(meta.backColor||'#813f58'),surface=safeColor(meta.surfaceColor||'#f7eee8');return `--card-back-color:${back};--card-surface-color:${surface};--back-ink:${contrast(back)}`}
function contrast(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return .2126*r+.7152*g+.0722*b>150?'#30242a':'#fff9f1'}
function backArt(meta){return `<div class="back-composition"><div class="back-logo">${meta.logoImage?`<img class="custom-back-logo" src="${meta.logoImage}" alt="Custom card logo">`:cloudLogo()}</div><div class="back-group">${esc(meta.groupName||meta.title||'MEMORY CLOUD')}</div></div>`}
function revealArt(meta){return `<div class="card-reveal"><strong>${esc(meta.name||'Favourite idol')}</strong><span>${esc(meta.title||'My collection')}</span>${meta.description?`<p>${esc(meta.description)}</p>`:''}</div>`}
function pocketHTML(b,p,side,n){const i=side*b.layout+n,photo=p.photos[i],meta=p.cardDetails?.[i]||{},zoom=Number(meta.zoom)||100,rotation=Number(meta.rotation)||0;return `<div class="pocket ${photo?'has-photo':''}" draggable="${!!photo}" data-action="${photo?'opencard':'slot'}" data-slot="${i}" role="button" tabindex="0" aria-label="${photo?'Open':'Upload'} photocard ${i+1}" title="${photo?'Click to open card':'Click to add a photo'}" style="${cardStyle(meta)}">${photo?`<div class="card-flipper"><div class="card-face card-front"><img style="--photo-zoom:${zoom/100};--photo-rotate:${rotation}deg" src="${photo}" alt="${esc(meta.name||'Photocard '+(i+1))}"></div></div><button type="button" class="card-delete" data-action="deletecard" data-slot="${i}" aria-label="Delete this photocard" title="Delete photocard">×</button>`:`<span class="plus">＋</span>`}</div>`}
function binder(){const b=book();if(!b)return shelf();const p=page(),cols=b.layout===9?3:2,rows=b.layout/cols;document.documentElement.style.setProperty('--binder',b.color);return `<section class="view"><div class="toolbar"><div class="left"><button class="outline" data-view="shelf">← Bookshelf</button><span class="eyebrow">${esc(b.name)}</span></div><div class="right"><button class="outline" data-action="coverModal" data-id="${b.id}">✦ Book cover</button><button class="outline" data-action="overview">▦ Page overview</button><button class="outline" data-action="newpage">＋ Add spread</button><button class="outline danger" data-action="deletepage">Delete spread</button></div></div><div class="mc-search"><input id="collectionSearch" class="control" placeholder="⌕ Search cards by name, group or era" aria-label="Search photocards"><button class="outline" data-action="search">Search collection</button></div><div class="workspace"><div class="panel"><div class="spread-title"><span style="font-size:23px">${esc(b.icon||'✦')}</span><input id="spreadTitle" value="${esc(p.title)}" maxlength="60" aria-label="Spread title" title="Edit spread title"></div><div class="stage"><div class="spread" style="--cols:${cols};--rows:${rows}">${[0,1].map(side=>`<div class="page"><div class="pockets">${Array.from({length:b.layout},(_,n)=>pocketHTML(b,p,side,n)).join('')}</div><div class="page-number" aria-label="Page ${b.index*2+side+1}">${b.index*2+side+1}</div></div>`).join('')}</div><div class="rings">${[0,1,2,3].map(()=>'<span class="ring"></span>').join('')}</div></div><div class="footnav"><button class="outline" data-action="prev" ${b.index===0?'disabled':''}>← Previous</button><select class="control" id="jump" aria-label="Jump to spread">${b.pages.map((pg,i)=>`<option value="${i}" ${i===b.index?'selected':''}>Page ${i*2+1} – ${i*2+2}</option>`).join('')}</select><button class="outline" data-action="next" ${b.index===b.pages.length-1?'disabled':''}>Next →</button></div><p class="muted" style="text-align:center">Drag cards to swap pockets, or drag them onto another spread in Page overview. Click an empty pocket to upload. Click an uploaded card to open it. Use Flip and Edit in the enlarged card view. Choose separate colours for the card back and frame in the editor.</p></div><aside class="side"><div class="panel"><span class="eyebrow">Binder details</span><h3>${esc(b.name)}</h3><div class="field"><label>Photocard pockets per page</label><select id="layout">${[4,6,9].map(n=>`<option value="${n}" ${b.layout===n?'selected':''}>${n} slots · ${n===4?'2 × 2':n===6?'2 × 3':'3 × 3'}</option>`).join('')}</select></div><div class="field"><label>Binder Cover</label><input type="color" id="binderColor" value="${esc(b.color)}"></div><div class="swatches">${[...new Set([...colors,...extraColors])].map(c=>`<button class="swatch ${b.color===c?'selected':''}" style="background:${c}" data-action="binderSwatch" data-color="${c}" aria-label="Set binder color ${c}"></button>`).join('')}</div><div class="field"><label>Binder emblem</label><select id="binderIcon">${['✦','☁','♥','✿','★','🎀','🍒','🌙','🦋','🌷'].map(i=>`<option ${b.icon===i?'selected':''}>${i}</option>`).join('')}</select></div></div><div class="panel"><span class="eyebrow">Little tips</span><p class="muted">Each spread has two pages. Add as many spreads as you like, then use the page selector to jump anywhere.</p><button class="outline" style="width:100%" data-view="theme">✧ Theme & Style</button></div></aside></div></section>`}const extraColors=['#fffdf8','#f4ede2','#e7d5c5','#cdb8a4','#987b69','#49362e','#17171d','#f9dbe5','#ed9cb5','#c84678','#882b51','#6b2545','#eac2ba','#d67b69','#b64e39','#8c3c2e','#fff1ad','#f1ce62','#caa14e','#9a7132','#e2efc9','#9bbd8e','#548c70','#275844','#d5eced','#8fcbd2','#4d9caf','#23536b','#e1e6fa','#9eafe0','#6a79b6','#373d7c','#f0def5','#c59ad7','#8d60a7','#58376d'];function swatchGroup(k,val){return `<div class="swatches">${[...new Set([...colors,...extraColors])].map(c=>`<button class="swatch ${val===c?'selected':''}" data-action="siteSwatch" data-key="${k}" data-color="${c}" style="background:${c}" aria-label="Set ${k} to ${c}"></button>`).join('')}</div>`}function theme(){return `<section class="view"><span class="eyebrow">Make it feel like yours</span><h1>Theme & Style</h1><p>Choose an aesthetic for the entire website. Binder covers can be customised separately inside each binder.</p><h2>Curated aesthetics</h2><div class="theme-grid">${presets.map((t,i)=>`<article class="panel"><div class="theme-preview" style="background:${t.bg}"><div style="background:${t.card};border:2px solid ${t.glow}"></div><div style="background:${t.accent}"></div><div style="background:${t.glow}"></div></div><div class="row" style="justify-content:space-between"><strong>${t.name}</strong><button class="outline" data-action="preset" data-index="${i}">Apply ✧</button></div></article>`).join('')}</div><h2 style="margin-top:34px">Custom colour studio</h2><div class="theme-grid">${[['bg','Background'],['accent','Buttons & accents'],['glow','Soft glow'],['ink','Text colour']].map(([k,label])=>`<div class="panel"><h3>${label}</h3><div class="field"><label>Pick your exact shade</label><input type="color" data-color-input="${k}" value="${esc(state.site[k]||(luma(state.site.bg)<.38?'#f5edf2':'#30282b'))}"></div>${swatchGroup(k,state.site[k]||(luma(state.site.bg)<.38?'#f5edf2':'#30282b'))}<span class="muted">${esc(state.site[k]||(luma(state.site.bg)<.38?'#f5edf2':'#30282b'))}</span></div>`).join('')}</div><div class="row" style="margin-top:24px"><button class="outline" data-action="resetTheme">Restore classic theme</button></div></section>`}function settings(){return `<section class="view"><span class="eyebrow">The essentials</span><h1>Settings</h1><div class="theme-grid"><div class="panel"><h3>Experience</h3><label class="row" style="padding:15px 0"><input id="sound" type="checkbox" ${state.sound?'checked':''}> Page flip sound effects</label><p class="muted">Turn sounds on or off. Page transitions remain animated.</p></div><div class="panel"><h3>Your collection data</h3><p class="muted">Your collection is saved in this browser using IndexedDB where available, with a fallback for older browsers. This is not cloud sync. Export backups regularly.</p><div class="row"><button class="button" data-action="export">↓ Export backup</button><button class="outline" data-action="import">↑ Import backup</button></div></div><div class="panel"><h3>Reset</h3><p class="muted">Erase all binders and settings saved in this browser. This cannot be undone unless you have a backup.</p><button class="outline danger" data-action="resetAll">Clear all local data</button></div></div></section>`}function modal(body){$('#overlay').innerHTML=`<div class="modalback" id="backdrop"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')close()})}function close(){$('#overlay').innerHTML=''}function createModal(){modal(`<h2>New memory binder ✦</h2><p>Give your collection a name and choose a starting colour.</p><form id="createForm"><div class="field"><label>Binder name</label><input name="name" placeholder="e.g. My Favourite Moments" maxlength="50" required autofocus></div><div class="field"><label>Starting cover colour</label><input type="color" name="color" value="#a46a81"></div><div class="field"><label>Pocket layout</label><select name="layout"><option value="4">4 slots · 2 × 2</option><option value="6">6 slots · 2 × 3</option><option value="9">9 slots · 3 × 3</option></select></div><div class="actions"><button class="outline" type="button" data-action="close">Cancel</button><button class="button" type="submit">Create binder</button></div></form>`);$('#createForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),b={id:id(),name:String(f.get('name')).trim(),color:String(f.get('color')),icon:'✦',layout:+f.get('layout'),index:0,pages:[{title:'My first memories',photos:{}}]};if(!b.name)return;state.books.push(b);state.active=b.id;state.view='binder';save();close();sound();render()}}function coverModal(b){if(!b)return;modal(`<h2>Design your book cover</h2><p>Personalise the book on your shelf.</p><div class="cover-editor-preview" style="--cover:${safeColor(b.color)};--cover-image:${b.coverImage?`url(${b.coverImage})`:'none'}"><span>${esc(b.icon||'✦')}</span><strong>${esc(b.name)}</strong></div><div class="field"><label>Cover colour</label><input type="color" id="coverPick" value="${safeColor(b.color)}"></div><div class="swatches cover-swatches">${[...new Set([...colors,...extraColors])].map(c=>`<button class="swatch" data-cover-choice="${c}" style="background:${c}" aria-label="Choose ${c}"></button>`).join('')}</div><label class="mc-upload">Cover image (optional)<input id="coverUpload" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="field"><label>Spine text</label><input id="spineText" maxlength="35" value="${esc(b.spineText||'')}" placeholder="e.g. My memories"></div><div class="field"><label>Book material</label><select id="coverMaterial">${['matte','linen','leather','glossy'].map(x=>`<option value="${x}" ${b.material===x?'selected':''}>${x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div><div class="actions"><button class="outline" id="removeCoverImage">Remove cover image</button><button class="button" data-action="close">Done</button></div>`);const preview=$('.cover-editor-preview');const refresh=()=>{preview.style.setProperty('--cover',b.color);preview.style.setProperty('--cover-image',b.coverImage?`url(${b.coverImage})`:'none');save()};$('#coverPick').oninput=e=>{b.color=e.target.value;refresh()};document.querySelectorAll('[data-cover-choice]').forEach(el=>el.onclick=()=>{b.color=el.dataset.coverChoice;$('#coverPick').value=b.color;refresh()});$('#spineText').oninput=e=>{b.spineText=e.target.value;save()};$('#coverMaterial').onchange=e=>{b.material=e.target.value;save()};$('#removeCoverImage').onclick=()=>{delete b.coverImage;refresh()};$('#coverUpload').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{b.coverImage=await optimizeImage(f,650,850,.78);refresh();toast('Cover image added')}catch{toast('Could not read cover image')}}}
function confirmModal(title,msg,fn){modal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="actions"><button class="outline" data-action="close">Cancel</button><button class="button" id="confirm">Confirm</button></div>`);$('#confirm').onclick=()=>{close();fn()}}let pageTurning=false;
function flip(to){
 const b=book();if(!b||pageTurning||to<0||to>=b.pages.length||to===b.index)return;
 const oldIndex=b.index, forward=to>oldIndex, stage=document.querySelector('.stage'),spread=stage?.querySelector('.spread');
 if(!stage||!spread||window.matchMedia('(prefers-reduced-motion: reduce)').matches){b.index=to;sound();save();render();return}
 pageTurning=true;
 const oldPage=spread.children[forward?1:0].cloneNode(true);
 b.index=to;save();render();sound();
 const newStage=document.querySelector('.stage'),newSpread=newStage?.querySelector('.spread');
 if(!newStage||!newSpread){pageTurning=false;return}
 const destination=newSpread.children[forward?0:1].cloneNode(true);
 const leaf=document.createElement('div');leaf.className='turning-leaf '+(forward?'leaf-forward':'leaf-backward');

let sleeveDraft=null;

function showPhoto(slot){const p=page();if(!p)return;const meta=p.cardDetails?.[slot]||{};sleeveDraft={slot,photo:p.photos[slot]||'',zoom:Number(meta.zoom)||100,rotation:Number(meta.rotation)||0,logoImage:meta.logoImage||''};modal(`<h2>Photocard Sleeve Editor</h2><p class="muted">Arrange your photo inside the sleeve and add its details.</p><label class="upload-zone" for="sleeveUpload"><span style="font-size:26px">☁</span><strong>Click to upload idol photo from device</strong><span class="muted">Supports PNG, JPG, WEBP</span></label><input id="sleeveUpload" type="file" accept="image/png,image/jpeg,image/webp" hidden><div class="sleeve-preview" id="sleevePreview"></div><div class="sleeve-controls"><label for="sleeveZoom">Zoom / Scale</label><span id="zoomValue">${sleeveDraft.zoom}%</span><input type="range" id="sleeveZoom" min="50" max="250" value="${sleeveDraft.zoom}"><label for="sleeveRotation">Rotation</label><span id="rotationValue">${sleeveDraft.rotation}°</span><input type="range" id="sleeveRotation" min="-180" max="180" value="${sleeveDraft.rotation}"></div><form id="sleeveForm"><div class="card-color-row"><div class="field"><label for="cardBackColor">Card back colour</label><input id="cardBackColor" name="backColor" type="color" value="${safeColor(meta.backColor||'#813f58')}"></div><div class="field"><label for="cardSurfaceColor">Card surface / frame colour</label><input id="cardSurfaceColor" name="surfaceColor" type="color" value="${safeColor(meta.surfaceColor||'#f7eee8')}"></div></div><div class="sleeve-fields"><div class="field"><label>Idol / Member Name</label><input name="name" maxlength="65" value="${esc(meta.name||'')}" placeholder="e.g. Sana"></div><div class="field"><label>Group / Era or Card Title</label><input name="title" maxlength="65" value="${esc(meta.title||'')}" placeholder="e.g. TWICE / Feel Special"></div></div><div class="field"><label>Group name (shown on card back)</label><input name="groupName" maxlength="65" value="${esc(meta.groupName||meta.title||'')}" placeholder="e.g. TWICE"></div><div class="field"><label>Card description</label><textarea name="description" maxlength="450" rows="3" placeholder="A little memory about this card...">${esc(meta.description||'')}</textarea></div><div class="field"><label>Custom logo for card back (optional)</label><input id="cardLogoUpload" type="file" accept="image/png,image/jpeg,image/webp"><div id="cardLogoPreview" class="logo-preview"></div><button type="button" class="outline" id="clearCardLogo">Use default cloud logo</button><p class="muted">The logo stays small and centred on the back.</p></div><div class="actions"><button type="button" class="outline danger" id="sleeveRemove">Remove Card</button><button type="button" class="outline" data-action="close">Cancel</button><button class="button" type="submit">Save to Sleeve</button></div></form>`);document.querySelector('.modal').classList.add('sleeve-modal');const preview=$('#sleevePreview');function updatePreview(){preview.innerHTML=sleeveDraft.photo?`<img src="${sleeveDraft.photo}" alt="Photocard preview">`:`<div class="placeholder">▧<p>No image loaded yet</p></div>`;preview.style.setProperty('--zoom',sleeveDraft.zoom/100);preview.style.setProperty('--rotation',sleeveDraft.rotation+'deg');$('#zoomValue').textContent=sleeveDraft.zoom+'%';$('#rotationValue').textContent=sleeveDraft.rotation+'°'}updatePreview();function updateLogoPreview(){$('#cardLogoPreview').innerHTML=sleeveDraft.logoImage?`<img src="${sleeveDraft.logoImage}" alt="Back logo preview">`:cloudLogo()}updateLogoPreview();$('#clearCardLogo').onclick=()=>{sleeveDraft.logoImage='';$('#cardLogoUpload').value='';updateLogoPreview()};$('#cardLogoUpload').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type))return toast('Choose a PNG, JPG or WEBP logo');try{const bitmap=await createImageBitmap(f),scale=Math.min(1,320/bitmap.width,320/bitmap.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();sleeveDraft.logoImage=canvas.toDataURL('image/png');updateLogoPreview()}catch{toast('Could not read logo image')}};$('#sleeveZoom').oninput=e=>{sleeveDraft.zoom=+e.target.value;updatePreview()};$('#sleeveRotation').oninput=e=>{sleeveDraft.rotation=+e.target.value;updatePreview()};$('#sleeveUpload').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('Choose PNG, JPG or WEBP');try{sleeveDraft.photo=await optimizeImage(file,1000,1300,.8);updatePreview()}catch{toast('Could not read image. Try another photo.')}};$('#sleeveForm').onsubmit=e=>{e.preventDefault();if(!sleeveDraft.photo)return toast('Upload a photo first');const f=new FormData(e.target),oldPhoto=p.photos[slot],oldMeta=p.cardDetails?.[slot];p.photos[slot]=sleeveDraft.photo;p.cardDetails??={};p.cardDetails[slot]={name:String(f.get('name')).trim(),title:String(f.get('title')).trim(),description:String(f.get('description')||'').trim(),groupName:String(f.get('groupName')||'').trim(),logoImage:sleeveDraft.logoImage,zoom:sleeveDraft.zoom,rotation:sleeveDraft.rotation,backColor:safeColor(f.get('backColor')),surfaceColor:safeColor(f.get('surfaceColor'))};if(!save()){if(oldPhoto)p.photos[slot]=oldPhoto;else delete p.photos[slot];if(oldMeta)p.cardDetails[slot]=oldMeta;else delete p.cardDetails[slot];return}close();render();sound();toast('Saved to sleeve ☁')};$('#sleeveRemove').onclick=()=>{delete p.photos[slot];if(p.cardDetails)delete p.cardDetails[slot];if(p.flipped)delete p.flipped[slot];if(p.revealed)delete p.revealed[slot];save();close();render()}}
function openCard(slot){const p=page(),src=p?.photos?.[slot];if(!src)return showPhoto(slot);const meta=p.cardDetails?.[slot]||{};modal(`<div class="opened-card-layout"><div class="opened-card-tools"><button type="button" class="outline" id="previewFlip" title="Flip card" aria-label="Flip card">↻ <span>Flip</span></button><button type="button" class="outline" id="previewEdit" title="Edit card" aria-label="Edit card">✎ <span>Edit</span></button><button type="button" class="outline" id="previewMove" title="Move card to another spread">⇢ <span>Move</span></button></div><div id="largeCard" class="preview-card" style="${cardStyle(meta)};--photo-zoom:${(Number(meta.zoom)||100)/100};--photo-rotate:${Number(meta.rotation)||0}deg"><div class="card-flipper"><div class="card-face card-front"><img src="${src}" alt="${esc(meta.name||'Photocard')}"></div><div class="card-face card-back">${backArt(meta)}</div></div></div><div class="opened-card-caption"><h3>${esc(meta.name||'Favourite idol')}</h3><p>${esc(meta.title||'My collection')}</p>${meta.description?`<div class="opened-card-description">${esc(meta.description)}</div>`:''}</div></div>`);document.querySelector('.modal').classList.add('opened-card-modal');const card=$('#largeCard'),flip=$('#previewFlip');flip.onclick=()=>{card.classList.toggle('is-flipped');flip.setAttribute('aria-pressed',String(card.classList.contains('is-flipped')))};$('#previewEdit').onclick=()=>showPhoto(slot);$('#previewMove').onclick=()=>{const b=book(),from=b.index;modal(`<h2>Move photocard</h2><p>Choose a destination spread. The card will be placed in the first empty pocket.</p><select id="moveDestination" class="control" style="width:100%">${b.pages.map((pg,i)=>`<option value="${i}" ${i===from?'disabled':''}>Page ${i*2+1} – ${i*2+2} · ${esc(pg.title)}</option>`).join('')}</select><div class="actions"><button class="outline" data-action="close">Cancel</button><button class="button" id="confirmMove">Move card</button></div>`);$('#confirmMove').onclick=( function overview(){const b=book();if(!b)return;modal(`<h2>Pages in ${esc(b.name)}</h2><p>Choose a spread to jump to it. To move a card to another spread, open the card and choose Move.</p><div class="mc-overview">${b.pages.map((p,i)=>`<button data-spread="${i}" title="Open spread ${i+1}"><div class="mc-mini">${[0,1].map(side=>`<div class="mc-mini-page">${Array.from({length:b.layout},(_,n)=>{const src=p.photos[side*b.layout+n];return src?`<img src="${src}" alt="">`:'<i></i>'}).join('')}</div>`).join('')}</div><strong>${i*2+1} – ${i*2+2}</strong><small style="display:block">${esc(p.title)}</small></button>`).join('')}</div>`);document.querySelectorAll('[data-spread]').forEach(el=>{el.onclick=()=>{const i=+el.dataset.spread;close();flip(i)};el.ondragover=e=>{e.preventDefault();el.style.outline='2px dashed var(--accent)'};el.ondragleave=()=>el.style.outline='';el.ondrop=e=>{e.preventDefault();const data=dragData;if(!data)return;const target=b.pages[+el.dataset.spread],available=Array.from({length:b.layout*2},(_,i)=>i).find(i=>!target.photos[i]);if(available===undefined)return toast('This spread is full');moveCard(data.page,data.slot,+el.dataset.spread,available);close();render();toast('Card moved to spread')}})}
let dragData=null;function moveCard(fromPage,fromSlot,toPage,toSlot){const b=book(),source=b?.pages[fromPage],target=b?.pages[toPage];if(!source||!target||fromPage===toPage&&fromSlot===toSlot)return;const a=source.photos[fromSlot],other=target.photos[toSlot];if(!a)return;const am=source.cardDetails?.[fromSlot],bm=target.cardDetails?.[toSlot];target.photos[toSlot]=a;if(other)source.photos[fromSlot]=other;else delete source.photos[fromSlot];source.cardDetails??={};target.cardDetails??={};if(am)target.cardDetails[toSlot]=am;else delete target.cardDetails[toSlot];if(bm)source.cardDetails[fromSlot]=bm;else delete source.cardDetails[fromSlot];delete source.flipped?.[fromSlot];delete source.revealed?.[fromSlot];delete target.flipped?.[toSlot];delete target.revealed?.[toSlot];save()}
function searchCollection(query){const q=(query||$('#collectionSearch')?.value||'').trim().toLowerCase();const matches=[];for(const b of state.books)for(let pi=0;pi<b.pages.length;pi++){const p=b.pages[pi];for(const [slot,src] of Object.entries(p.photos||{})){const m=p.cardDetails?.[slot]||{};if(!q||[m.name,m.title,m.groupName,m.description,b.name,p.title].some(v=>String(v||'').toLowerCase().includes(q)))matches.push({b,pi,slot,src,m})}}modal(`<h2>Search collection</h2><p>${matches.length} photocard${matches.length===1?'':'s'} found</p><input id="modalSearch" class="control" placeholder="Search name, group or era" value="${esc(query||'')}" aria-label="Search collection" style="width:100%;margin-bottom:14px"><div class="mc-results">${matches.slice(0,150).map((x,i)=>`<button class="mc-result" data-result="${i}"><img src="${x.src}" alt=""><span><strong>${esc(x.m.name||x.m.title||'Photocard')}</strong><small>${esc(x.m.groupName||x.m.title||'')} · ${esc(x.b.name)}</small><small>Page ${x.pi*2+1} – ${x.pi*2+2}</small></span></button>`).join('')||'<p>No matching cards yet.</p>'}</div>`);$('#modalSearch').onkeydown=e=>{if(e.key==='Enter')searchCollection(e.target.value)};document.querySelectorAll('[data-result]').forEach(el=>el.onclick=()=>{const x=matches[+el.dataset.result];state.active=x.b.id;x.b.index=x.pi;state.view='binder';close();save();render();openCard(+x.slot)})}
async function optimizeImage(file,maxW=1000,maxH=1300,quality=.82){const bitmap=await createImageBitmap(file),scale=Math.min(1,maxW/bitmap.width,maxH/bitmap.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',quality)}
function download(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function act(action,el){let b=book(),p=page();switch(action){case'new':createModal();break;case'coverModal':coverModal(state.books.find(x=>x.id===el.dataset.id));break;case'close':close();break;case'open':state.active=el.dataset.id;state.view='binder';save();render();break;case'rename':{let x=state.books.find(x=>x.id===el.dataset.id);let name=prompt('Rename binder',x.name);if(name?.trim()){x.name=name.trim().slice(0,50);save();render()}break}case'deletebook':{let x=state.books.find(x=>x.id===el.dataset.id);confirmModal('Delete binder?',`Delete “${x.name}” and all its photos?`,()=>{state.books=state.books.filter(y=>y.id!==x.id);if(state.active===x.id)state.active=state.books[0]?.id||null;save();render()});break}case'overview':overview();break;case'search':searchCollection();break;case'newpage':b.pages.push({title:'New memories',photos:{}});flip(b.pages.length-1);break;case'deletepage':confirmModal('Delete this spread?',b.pages.length===1?'This will clear the only spread and its photos.':'This spread and its photos will be deleted.',()=>{if(b.pages.length===1)b.pages=[{title:'My first memories',photos:{}}];else b.pages.splice(b.index,1);b.index=Math.min(b.index,b.pages.length-1);save();render()});break;case'prev':flip(b.index-1);break;case'next':flip(b.index+1);break;case'slot':if(p?.photos?.[el.dataset.slot])openCard(+el.dataset.slot);else choosePhoto(+el.dataset.slot);break;case'editcard':showPhoto(+el.dataset.slot);break;case'opencard':openCard(+el.dataset.slot);break;case'flipcard':{p.flipped??={};p.revealed??={};const n=el.dataset.slot;const stage=p.flipped[n]?2:p.revealed[n]?1:0;const next=(stage+1)%3;p.flipped[n]=next===2;p.revealed[n]=next===1;save();const pocket=el.closest('.pocket');if(pocket){pocket.classList.toggle('is-flipped',next===2);pocket.classList.toggle('is-revealed',next===1)}break;}case'deletecard':{const slot=el.dataset.slot;confirmModal('Delete photocard?','This removes the photo and its details from this sleeve.',()=>{delete p.photos[slot];if(p.cardDetails)delete p.cardDetails[slot];if(p.flipped)delete p.flipped[slot];if(p.revealed)delete p.revealed[slot];save();render()});break;}case'removephoto':delete p.photos[el.dataset.slot];if(p.cardDetails)delete p.cardDetails[el.dataset.slot];if(p.flipped)delete p.flipped[el.dataset.slot];if(p.revealed)delete p.revealed[el.dataset.slot];save();render();break;case'binderSwatch':b.color=el.dataset.color;save();render();break;case'siteSwatch':state.site[el.dataset.key]=el.dataset.color;save();render();break;case'preset':state.site={...presets[+el.dataset.index]};save();render();toast('Theme applied ✦');break;case'resetTheme':state.site={...presets[0]};save();render();break;case'export':download('memory-cloud-backup.json',JSON.stringify({version:1,books:state.books,active:state.active,site:state.site,sound:state.sound},null,2),'application/json');toast('Backup downloaded');break;case'import':$('#importInput').click();break;case'resetAll':confirmModal('Clear everything?','All binders, photos and settings on this device will be erased.',()=>{localStorage.removeItem(KEY);if(db)db.transaction('collections','readwrite').objectStore('collections').delete('main');state={books:[],active:null,view:'shelf',site:{...presets[0]},sound:true};render()});break}}document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-view]');if(!el)return;if(el.dataset.action){if(['deletecard','removephoto','flipcard','editcard','opencard'].includes(el.dataset.action))e.stopPropagation();act(el.dataset.action,el)}else setView(el.dataset.view)});document.addEventListener('dragstart',e=>{const el=e.target.closest('.pocket.has-photo');if(!el||state.view!=='binder')return;dragData={page:book().index,slot:+el.dataset.slot};el.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','memory-cloud-card')});document.addEventListener('dragend',()=>{dragData=null;document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'))});document.addEventListener('dragover',e=>{const el=e.target.closest('.pocket');if(!el||!dragData)return;e.preventDefault();el.classList.add('drop-target')});document.addEventListener('dragleave',e=>{const el=e.target.closest('.pocket');if(el)el.classList.remove('drop-target')});document.addEventListener('drop',e=>{const el=e.target.closest('.pocket');if(!el||!dragData)return;e.preventDefault();e.stopPropagation();moveCard(dragData.page,dragData.slot,book().index,+el.dataset.slot);dragData=null;render();toast('Photocards rearranged')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.key==='e'||e.key==='E')&&e.target.classList.contains('pocket')&&page()?.photos?.[e.target.dataset.slot]){e.preventDefault();showPhoto(+e.target.dataset.slot)}if(e.key==='Enter'&&e.target.classList.contains('pocket')){e.preventDefault();act(e.target.dataset.action||'slot',e.target)}});document.addEventListener('change',e=>{const t=e.target,b=book();if(t.id==='layout'){const n=+t.value;if(n<b.layout&&b.pages.some(pg=>Object.keys(pg.photos).some(i=>+i>=n*2))){if(!confirm('Changing to fewer slots will remove photos in extra pockets. Continue?')){render();return}b.pages.forEach(pg=>Object.keys(pg.photos).forEach(i=>{if(+i>=n*2)delete pg.photos[i]}))}b.layout=n;save();render()}if(t.id==='binderColor'){b.color=t.value;save();render()}if(t.id==='binderIcon'){b.icon=t.value;save();render()}if(t.id==='jump')flip(+t.value);if(t.id==='sound'){state.sound=t.checked;save()}if(t.dataset.colorInput){state.site[t.dataset.colorInput]=t.value;save();render()}});document.addEventListener('input',e=>{if(e.target.id==='spreadTitle'&&book()){page().title=e.target.value;save()}});$('#photoInput').onchange=async e=>{const file=e.target.files[0],target=uploadTarget;if(!file||target==null||!book())return;if(!file.type.startsWith('image/'))return toast('Please choose an image file');try{const img=await createImageBitmap(file),scale=Math.min(1,900/img.width,1200/img.height),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close();const old=page().photos[target];page().photos[target]=canvas.toDataURL('image/jpeg',.78);if(!save()){if(old)page().photos[target]=old;else delete page().photos[target];return}sound();render();toast('Photocard added ✦')}catch{toast('Could not read this photo. Try JPG or PNG.')}};$('#importInput').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.books)||!data.books.every(b=>Array.isArray(b.pages)&&typeof b.name==='string'))throw Error();confirmModal('Restore backup?','This replaces the current bookshelf and photos on this device.',()=>{state.books=data.books;state.active=data.active;state.site={...presets[0],...data.site};state.sound=data.sound!==false;state.view='shelf';save();render();toast('Backup restored')})}catch{toast('Invalid Memory Cloud backup file')}e.target.value=''};if(!book()&&state.view==='binder')state.view='shelf';render();if('indexedDB' in window){try{const req=indexedDB.open('memory-cloud-library',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('collections'))req.result.createObjectStore('collections')};req.onsuccess=()=>{db=req.result;const tx=db.transaction('collections','readonly'),read=tx.objectStore('collections').get('main');read.onsuccess=()=>{if(read.result?.books){state=read.result;state.site={...presets[0],...state.site};if(!book()&&state.view==='binder')state.view='shelf';render()}else save()}};req.onerror=()=>toast('Using fallback browser storage')}catch{}}})();
